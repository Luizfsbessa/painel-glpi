name: Automatizar Relatorio GLPI

on:
  schedule:
    # Executa a cada 2 horas (você pode ajustar a cron expression conforme preferir)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Verificar versao do Python local
      run: python --version

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests openpyxl urllib3

    - name: Executar script de atualizacao
      run: |
        python atualizar_glpi.py # Substitua pelo nome exato do seu arquivo .py

    - name: Enviar alteracoes de volta para o repositorio
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add "relatorio glpi.xlsx"
        git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica do relatorio GLPI [skip ci]" && git push)